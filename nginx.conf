# Serves the built Flutter web app (static) and proxies API requests
# to the Flask backend. See the multi-stage Dockerfile (stage "web").
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Flask API accepts uploads up to 1 GB (MAX_CONTENT_LENGTH)
    client_max_body_size 2g;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── API -> Flask ──────────────────────────────────────────────────────
    # Enumerated API prefixes (must precede the asset-cache regex below:
    # e.g. /thumbnails/<name>.jpg would otherwise match the asset regex).
    # "session_"/"debug-" are open prefixes (any continuation); the rest must
    # be followed by "/" or end-of-path. "dex" covers /dex/token and
    # /dex/userinfo.
    location ~ ^/(login|register|forgot-password|videos|video_detail|media|thumbnails|upload|upload-chunk|finish-upload|start_job|job_status|check-session|gettoken|dex|clear-videos|update_video_subtitles|extract_video_subtitles|api)(/|$)|^/session_|^/debug- {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;  # stream large uploads straight to Flask
        proxy_buffering off;          # stream /media/<key> video playback
        proxy_read_timeout 3600s;     # /upload waits up to 1 h on the internal server
        proxy_send_timeout 3600s;
    }

    # ── Hashed Flutter build assets -> long-lived cache ──────────────────
    location ~* \.(?:js|css|json|woff2?|ttf|otf|png|jpe?g|gif|svg|ico|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────
    # index.html has no extension, so it is not caught by the asset regex.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
