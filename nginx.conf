# Serves the built Flutter web app (static) and proxies API requests
# to the Flask backend. See the multi-stage Dockerfile (stage "web").
server {
    listen 80;
    server_name _;

    # The Flask API accepts uploads up to 1 GB (MAX_CONTENT_LENGTH)
    client_max_body_size 2g;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Root directory of your Flutter web build (contains index.html)
    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────────────────────────
    # 1. Never cache the entry points — they decide what else to load.
    # ─────────────────────────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ─────────────────────────────────────────────────────────────
    # 2. Hashed Flutter build assets -> long-lived cache
    # ─────────────────────────────────────────────────────────────
    location ~* \.(?:js|css|json|woff2?|ttf|otf|png|jpe?g|gif|svg|ico|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ─────────────────────────────────────────────────────────────
    # 3. SPA fallback — any other request returns index.html
    #    (so Flutter's router can handle the route)
    # ─────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────────────────────────
    # 4. Optional: reverse proxy for your API (if needed)
    # ─────────────────────────────────────────────────────────────
    # location /api/ {
    #     proxy_pass http://localhost:5000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # ── API -> Flask ──────────────────────────────────────────────────────
    # Enumerated API prefixes (must precede the asset-cache regex below:
    # e.g. /thumbnails/<name>.jpg would otherwise match the asset regex).
    # "session_"/"debug-" are open prefixes (any continuation); the rest must
    # be followed by "/" or end-of-path. "dex" covers /dex/token and
    # /dex/userinfo.
    location ~ ^/(login|register|forgot-password|videos|video_detail|media|thumbnails|upload|upload-chunk|finish-upload|start_job|job_status|job_progress|forward_to_internal|delete_video|update_project_name|stop_segmentation|check-session|gettoken|dex|clear-videos|update_video_subtitles|extract_video_subtitles|api)(/|$)|^/session_|^/debug- {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;  # stream large uploads straight to Flask
        proxy_buffering off;          # stream /media/<key> video playback
        proxy_read_timeout 3600s;     # /upload waits up to 1 h on the internal server
        proxy_send_timeout 3600s;
        proxy_cache off;
        proxy_set_header Connection "";
    }

}
