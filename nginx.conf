# Serves the built Flutter web app (static) and proxies API requests
# to the Flask backend. See the multi-stage Dockerfile (stage "web").
server {
    listen 80;
    server_name _;

    client_max_body_size 2g;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────────────────────────
    # 1. Never cache entry points
    # ─────────────────────────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ─────────────────────────────────────────────────────────────
    # 2. API → Flask. MUST come before the asset-cache regex.
    #    /thumbnails/foo.jpg would otherwise match the asset regex
    #    and 404 against the local static root.
    # ─────────────────────────────────────────────────────────────
    location ~ ^/(login|register|forgot-password|videos|video-detail|media|thumbnails|upload|upload-chunk|finish-upload|start-job|job-status|job-progress|forward-to-internal|delete-video|update-project-name|stop-segmentation|check-session|gettoken|dex|clear-videos|update-video-subtitles|extract-video-subtitles|api)(/|$)|^/session-|^/debug- {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        # $http_host keeps ":8273"; $host strips it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_cache off;
        proxy_set_header Connection "";
    }

    # ─────────────────────────────────────────────────────────────
    # 3. Hashed Flutter build assets → long-lived cache
    # ─────────────────────────────────────────────────────────────
    location ~* \.(?:js|css|json|woff2?|ttf|otf|png|jpe?g|gif|svg|ico|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ─────────────────────────────────────────────────────────────
    # 4. SPA fallback
    # ─────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
