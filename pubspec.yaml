name: asr_live_translator
description: Get all automatically translated and subtitled in 25 languages, editing and downloading the video with subtitles.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.3
  http: ^1.6.0
  provider: ^6.1.1
  collection: ^1.18.0
  scrollable_positioned_list: ^0.3.8  # For smooth scrolling to segments
  flutter_web_auth: ^0.5.0
  crypto: ^3.0.3
  mobile_scanner: ^7.4.0
  web: ^1.0.0
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.5
  wakelock_plus: ^1.2.0          # <-- replace wakelock (deprecated)
  package_info_plus: ^10.2.1
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  share_plus: ^13.2.1             # <-- upgrade
  path_provider: ^2.1.6
  html: ^0.15.6
  pdf: ^3.13.0
  printing: ^5.15.0               # <-- upgrade
  webview_windows: ^0.4.0         # <-- use this instead of webview_flutter
  flutter_secure_storage: ^10.3.1 # <-- upgrade
  file_picker: ^3.0.4
  http_parser: ^4.0.2
  mime: ^2.0.0
  path: ^1.9.0
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/languages.json
    - assets/icon/app_icon.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSansSC-Regular.ttf      # Simplified Chinese
    - assets/fonts/NotoSansTC-Regular.ttf      # Traditional Chinese
    - assets/fonts/NotoSansJP-Regular.ttf      # Japanese
    - assets/fonts/NotoSansKR-Regular.ttf      # Korean
    - assets/fonts/NotoSansArabic-Regular.ttf  # Arabic / Persian
    
# --- launcher icon generation ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#4F46E5"
    theme_color: "#4F46E5"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
